<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#eaf4ff">
  <title>蓝莓童话汇 · 像素写作台</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/screens.css">
</head>
<body>

  <!-- 开机动画 -->
  <div class="boot" id="boot">
	<div class="boot-sky" id="boot-sky"></div>
	<div class="boot-core">
	  <div class="boot-badge px-box" data-sprite="blueberry"></div>
	  <span class="boot-badge-2 px-box" data-sprite="orange"></span>
	  <h1 class="boot-title"><span>蓝</span><span>莓</span><span>童</span><span>话</span><span>汇</span></h1>
	  <p class="boot-sub">BLUEBERRY FAIRY TALES</p>
	  <div class="boot-bar"><i id="boot-bar-fill"></i></div>
	  <p class="boot-tip" id="boot-tip">正在点亮蓝莓灯…</p>
	</div>
	<div class="boot-hint">TAP TO SKIP</div>
  </div>

  <!-- 开机密码 -->
  <div class="lock hidden" id="lock">
	<div class="lock-card" id="lock-card">
	  <span class="px-box lock-mark" data-sprite="blueberry"></span>
	  <h2>输入开机密码</h2>
	  <p class="lock-sub">BLUEBERRY STUDIO · 4 DIGITS</p>
	  <div class="lock-dots" id="lock-dots"><i></i><i></i><i></i><i></i></div>
	  <p class="lock-msg" id="lock-msg">输入开机密码</p>
	  <div class="pad" id="lock-pad"></div>
	</div>
  </div>

  <!-- 主应用 -->
  <div class="app hidden" id="app">
	<header class="topbar">
	  <div class="brand">
		<span class="px-box brand-mark" data-sprite="blueberry"></span>
		<span class="brand-name">蓝莓童话汇</span>
	  </div>
	  <div class="top-title" id="top-title">写作</div>
	  <div class="top-actions">
		<span class="chip" id="top-words">今日 0 字</span>
		<button class="icon-btn" id="btn-lock" type="button" aria-label="锁屏">✦</button>
	  </div>
	</header>

	<main class="view">
	  <section class="screen" id="screen-write"></section>
	  <section class="screen hidden" id="screen-shelf"></section>
	  <section class="screen hidden" id="screen-replay"></section>
	  <section class="screen hidden" id="screen-me"></section>
	</main>

	<nav class="tabbar">
	  <button class="tab on" type="button" data-tab="write">
		<span class="px-box tab-ico" data-sprite="pencil"></span><span class="tab-label">写作</span>
	  </button>
	  <button class="tab" type="button" data-tab="shelf">
		<span class="px-box tab-ico" data-sprite="doc"></span><span class="tab-label">书架</span>
	  </button>
	  <button class="tab" type="button" data-tab="replay">
		<span class="px-box tab-ico" data-sprite="play"></span><span class="tab-label">回放</span>
	  </button>
	  <button class="tab" type="button" data-tab="me">
		<span class="px-box tab-ico" data-sprite="heart"></span><span class="tab-label">我的</span><i class="tab-dot hidden" id="dot-me"></i>
	  </button>
	</nav>
  </div>

  <!-- 写作编辑器 -->
  <div class="editor hidden" id="editor">
	<header class="ed-head">
	  <button class="ed-back" id="ed-back" type="button" aria-label="返回">‹</button>
	  <div class="ed-titles">
		<div class="ed-book" id="ed-book-title">书名</div>
		<div class="ed-ch" id="ed-ch-title">第一章</div>
	  </div>
	  <button class="ed-back" id="ed-chapters" type="button" aria-label="章节目录">☰</button>
	  <button class="ed-back" id="ed-tools" type="button" aria-label="写作工具">✦</button>
	</header>
	<div class="ed-goal">
	  <span class="ed-state" id="ed-state">记录中</span>
	  <div class="bar"><i id="ed-bar"></i></div>
	  <span class="ed-count" id="ed-count">0 字</span>
	</div>
	<div class="ed-scroll">
	  <textarea class="ed-area" id="ed-area" placeholder="从这里开始你的童话……&#10;&#10;每一次输入都会被记录，之后可以在「回放」里逐字看回去。" autocomplete="off" spellcheck="false"></textarea>
	</div>
	<footer class="ed-foot">
	  <button class="ed-btn" type="button" data-ed="toc"><b>☰</b>目录</button>
	  <button class="ed-btn" type="button" data-ed="minus"><b>A−</b>字号</button>
	  <button class="ed-btn" type="button" data-ed="plus"><b>A+</b>字号</button>
	  <button class="ed-btn" type="button" data-ed="focus"><b>◱</b>沉浸</button>
	  <button class="ed-btn save" type="button" data-ed="save"><b>✓</b>保存</button>
	  <button class="ed-btn" type="button" data-ed="more"><b>✦</b>更多</button>
	</footer>
	<button class="ed-exit" id="ed-exit" type="button">退出沉浸</button>
  </div>

  <!-- 只读阅读器（本地导入的书籍只能看，不能编辑） -->
  <div class="reader t-berry hidden" id="reader">
	<header class="rd-head">
	  <button class="ed-back" id="rd-back" type="button" aria-label="返回">‹</button>
	  <div class="ed-titles">
		<div class="ed-book" id="rd-book-title">书名</div>
		<div class="ed-ch" id="rd-ch-title">只读 · 第 1 / 1 章</div>
	  </div>
	  <button class="ed-back" id="rd-toc" type="button" aria-label="章节目录">☰</button>
	  <button class="ed-back" id="rd-set" type="button" aria-label="阅读设置">A</button>
	</header>
	<div class="rd-scroll" id="rd-scroll">
	  <article class="rd-body" id="rd-body"></article>
	</div>
	<div class="rd-clean-tip" id="rd-exit-wrap">
	  <button class="rd-exit" id="rd-exit" type="button">显示工具栏</button>
	</div>
	<footer class="rd-foot">
	  <div class="rd-line">
		<button class="rd-btn" id="rd-prev" type="button">‹ 上一章</button>
		<input class="rd-range" id="rd-range" type="range" min="0" max="1000" value="0" aria-label="阅读进度">
		<button class="rd-btn" id="rd-next" type="button">下一章 ›</button>
	  </div>
	  <div class="rd-line rd-sub">
		<span class="rd-pos" id="rd-pos">正文</span>
		<button class="rd-chip" id="rd-auto" type="button">▶ 自动阅读</button>
		<span class="rd-pos" id="rd-pct">0%</span>
	  </div>
	</footer>
	<div class="rd-mask hidden" id="rd-mask"></div>
	<div class="rd-panel hidden" id="rd-panel"></div>
	<div class="rd-dim" id="rd-dim"></div>
  </div>

  <input type="file" id="import-input" accept=".txt,.md,.markdown,.text,text/plain" multiple hidden>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="./js/sprites.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/editor.js"></script>
  <script src="./js/replay.js"></script>
  <script src="./js/update.js"></script>
  <script src="./js/reader.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
